name: ConsentHub CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Verify (Java 21 Temurin + PostgreSQL 16 + JUnit 5 + JaCoCo)
  # ----------------------------------------------------------------------------
  backend-verify:
    name: Backend Build, Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: consenthub
          POSTGRES_USER: consenthub
          POSTGRES_PASSWORD: consenthub_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U consenthub -d consenthub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile, verify & run JUnit 5 tests with JaCoCo coverage
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/consenthub
          SPRING_DATASOURCE_USERNAME: consenthub
          SPRING_DATASOURCE_PASSWORD: consenthub_ci_test_only
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: consenthub
          POSTGRES_USER: consenthub
          POSTGRES_PASSWORD: consenthub_ci_test_only
          JWT_SECRET: ci-test-only-minimum-32-bytes-hmac-signing-key-2026
          IP_HASH_SALT: ci-test-only-ip-privacy-salt-2026
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
        run: mvn -B --no-transfer-progress verify

      - name: Upload Backend JaCoCo Coverage & Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-and-test-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Verify (Node 22 + TypeScript + Lint + Vitest Coverage + Build)
  # ----------------------------------------------------------------------------
  frontend-verify:
    name: Frontend Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint & strict TypeScript check
        working-directory: frontend
        run: |
          npm run lint --if-present
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Run Vitest unit & component tests with coverage
        working-directory: frontend
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          else
            npx vitest run --coverage
          fi

      - name: Build production SPA & verify SDK static assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_DEMO_SDK_API_KEY: ch_live_demo_public_sdk_key_2026
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/consent.js
          test -f dist/sdk-demo.html

      - name: Upload Frontend Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # Job 3: Docker Compose Stack, Newman REST/GraphQL API Suite & Playwright E2E
  # ----------------------------------------------------------------------------
  e2e-and-api:
    name: Docker Build, Newman API & Playwright E2E
    needs:
      - backend-verify
      - frontend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Boot full Docker Compose stack and wait for healthy services
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
          docker compose ps

      - name: Verify live health & static SDK endpoints
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -I http://localhost:5173/
          curl -fsS -I http://localhost:5173/consent.js

      - name: Execute Newman API Collection
        run: |
          mkdir -p test-results
          if [ -f tests/api/consenthub.postman_environment.json ]; then
            npx --yes newman run tests/api/consenthub.postman_collection.json \
              -e tests/api/consenthub.postman_environment.json \
              --reporters cli,junit \
              --reporter-junit-export test-results/newman-report.xml
          else
            npx --yes newman run tests/api/consenthub.postman_collection.json \
              --env-var "baseUrl=http://localhost:8080" \
              --env-var "frontendUrl=http://localhost:5173" \
              --reporters cli,junit \
              --reporter-junit-export test-results/newman-report.xml
          fi

      - name: Install Playwright browsers & execute E2E suite
        env:
          CI: "true"
          BASE_URL: http://localhost:5173
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.mjs ] || [ -f playwright.config.js ]; then
            if [ -f package.json ]; then
              if [ -f package-lock.json ]; then npm ci; else npm install; fi
            fi
            npx playwright install --with-deps chromium
            npx playwright test
          else
            cd frontend
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npx playwright install --with-deps chromium
            npx playwright test
          fi

      - name: Capture Docker container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color > docker-compose.log

      - name: Upload Playwright Report, Newman Results & Container Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-and-api-artifacts
          path: |
            playwright-report/
            frontend/playwright-report/
            test-results/
            frontend/test-results/
            docker-compose.log
          if-no-files-found: ignore

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
