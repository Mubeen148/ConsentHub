server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: consenthub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consenthub}
    username: ${SPRING_DATASOURCE_USERNAME:consenthub}
    password: ${SPRING_DATASOURCE_PASSWORD:consenthub_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  graphql:
    path: /graphql
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:false}
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls
      introspection:
        enabled: ${GRAPHQL_INTROSPECTION_ENABLED:true}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

consenthub:
  version: "1.0.0"
  jwt:
    # Local development fallback (>= 32 bytes). Production profile fails fast if unset or placeholder.
    secret: ${JWT_SECRET:local-dev-only-consenthub-jwt-signing-key-2026-min-32-bytes!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    access-token-name: ch_access_token
    csrf-token-name: ch_csrf_token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:5173,http://127.0.0.1}
  privacy:
    ip-hash-salt: ${IP_HASH_SALT:consenthub-dev-privacy-ip-salt-2026}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    export-per-minute: ${RATE_LIMIT_EXPORT_PER_MINUTE:5}
    sdk-per-minute: ${RATE_LIMIT_SDK_PER_MINUTE:120}
