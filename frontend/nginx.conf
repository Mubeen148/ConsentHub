# ==============================================================================
# ConsentHub — Nginx Reverse Proxy & SPA Static Server Configuration
# ==============================================================================
# Listens on container port 80 (mapped to `${FRONTEND_PORT:-5173}:80` in Docker
# Compose so `http://localhost:5173` works identically in Vite dev & Docker).
# Proxies `/api/`, `/graphql`, and `/actuator/` to `http://backend:8080` so
# `HttpOnly; SameSite=Lax` cookies (`ch_access_token`) and double-submit CSRF
# (`ch_csrf_token` + `X-CSRF-Token`) operate seamlessly on a single origin.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Compression for JSON, GraphQL, JS, CSS, and SVG assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/graphql+json
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Backend REST API Proxy (`/api/v1/auth/*`, `/api/v1/privacy/*`, `/api/v1/sdk/*`)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Consent-Region $http_x_consent_region;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Origin $http_origin;
        proxy_cookie_path / /;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 2. Spring for GraphQL Endpoint Proxy (`/graphql`)
    # --------------------------------------------------------------------------
    location /graphql {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Consent-Region $http_x_consent_region;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Origin $http_origin;
        proxy_cookie_path / /;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 3. Spring Boot Actuator Health/Info Proxy (`/actuator/*`)
    # --------------------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # 4. Embeddable Third-Party Browser SDK (`/consent.js`)
    #    Served with permissive CORS so external properties can embed the script.
    # --------------------------------------------------------------------------
    location = /consent.js {
        try_files /consent.js =404;
        default_type application/javascript;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # 5. Standalone Third-Party Host Demo Page (`/sdk-demo.html`)
    # --------------------------------------------------------------------------
    location = /sdk-demo.html {
        try_files /sdk-demo.html =404;

        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --------------------------------------------------------------------------
    # 6. Immutable Content-Hashed Vite Assets (`/assets/*`)
    # --------------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # 7. React SPA Client-Side Router Fallback (`/` -> `/index.html`)
    #    Emits full OWASP / SEC-G06 security headers.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
